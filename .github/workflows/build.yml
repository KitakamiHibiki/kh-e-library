name: Build & Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

env:
  VERSION_FILE: VERSION

jobs:
  backend:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cgo: 1
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cgo: 1
            deps: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
            cgo: 1
            deps: gcc-mingw-w64-x86-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilers
        if: matrix.deps
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          if [ -d client/web ]; then
            cd client/web
            npm install
            npm run build
          else
            echo "client/web not found, skipping frontend"
          fi

      - name: Copy frontend dist to backend
        run: |
          mkdir -p backend/web/dist
          if [ -d client/web/dist ]; then
            cp -r client/web/dist/* backend/web/dist/
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          cd backend
          VERSION=$(cat ../${{ env.VERSION_FILE }})
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          binary="kh-e-library${ext}"
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "${binary}" ./cmd/server
          echo "binary=${binary}" >> $GITHUB_ENV

      - name: Package archive
        run: |
          cd backend
          VERSION=$(cat ../${{ env.VERSION_FILE }})
          if [ "${{ matrix.goos }}" = "windows" ]; then
            archive="kh-e-library-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
            zip "${archive}" "${binary}" application.yml
          else
            archive="kh-e-library-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar czf "${archive}" "${binary}" application.yml
          fi
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: backend/${{ env.archive }}
          if-no-files-found: error

  backend-darwin:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          if [ -d client/web ]; then
            cd client/web
            npm install
            npm run build
          else
            echo "client/web not found, skipping frontend"
          fi

      - name: Copy frontend dist to backend
        run: |
          mkdir -p backend/web/dist
          if [ -d client/web/dist ]; then
            cp -r client/web/dist/* backend/web/dist/
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          cd backend
          VERSION=$(cat ../${{ env.VERSION_FILE }})
          binary="kh-e-library"
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "${binary}" ./cmd/server
          echo "binary=${binary}" >> $GITHUB_ENV

      - name: Package archive
        run: |
          cd backend
          VERSION=$(cat ../${{ env.VERSION_FILE }})
          archive="kh-e-library-${VERSION}-darwin-${{ matrix.goarch }}.tar.gz"
          tar czf "${archive}" "${binary}" application.yml
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.archive }}
          path: backend/${{ env.archive }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android source
        id: check
        run: |
          if [ -f client/android/build.gradle ] || [ -f client/android/app/build.gradle ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        if: steps.check.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        if: steps.check.outputs.exists == 'true'
        run: |
          cd client/android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease
      - name: Upload APK
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/android/app/build/outputs/apk/release/*.apk
        continue-on-error: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, backend-darwin, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p assets
          find artifacts -type f | while read f; do
            cp "$f" assets/
          done
          ls -la assets/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true