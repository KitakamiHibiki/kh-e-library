org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The user-global ~/.gradle/gradle.properties points at a local proxy
# (127.0.0.1:7890, e.g. Clash) which is often offline. Direct connections work,
# so neutralize the proxy for this project. Remove these lines if you run the
# proxy and want Gradle to use it again.
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
